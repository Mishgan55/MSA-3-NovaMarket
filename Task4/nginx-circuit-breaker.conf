events {}

http {
    upstream logistics_backend {
        # Circuit breaker на пассивных проверках: 5 неудачных запросов подряд (в окне 30 с) — сервер исключается на 30 с.
        # Через 30 с nginx пропускает к нему пробный запрос: успех возвращает трафик, ошибка снова открывает breaker на 30 с
        server logistics.company.com max_fails=5 fail_timeout=30s;

        # nginx игнорирует max_fails, если в группе один сервер, поэтому fallback оформлен резервным сервером.
        # Он получает трафик, только пока основной исключён или не ответил. max_fails=0 — fallback никогда не исключается
        server 127.0.0.1:8081 backup max_fails=0;
    }

    server {
        listen 8080;

        location /logistics/ {
            proxy_pass http://logistics_backend;

            # Таймаут ответа — 3 секунды вместо 30
            proxy_connect_timeout 3s;
            proxy_send_timeout 3s;
            proxy_read_timeout 3s;

            # Что считается неудачей: ошибка соединения, таймаут и 5xx. Неудачный запрос сразу уходит в fallback
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 2;

            # Если nginx сам не смог получить ответ (например, POST не повторяется на резервный сервер) — тот же fallback
            error_page 502 504 = @logistics_fallback;
        }

        location @logistics_fallback {
            default_type application/json;
            add_header Retry-After 30 always;
            add_header X-Fallback "logistics" always;
            return 503 '{"code":"LOGISTICS_UNAVAILABLE","message":"Служба доставки временно недоступна, повторите попытку позже"}';
        }
    }

    # Fallback-ответ, пока логистика недоступна
    server {
        listen 127.0.0.1:8081;

        location / {
            default_type application/json;
            add_header Retry-After 30 always;
            add_header X-Fallback "logistics" always;
            return 503 '{"code":"LOGISTICS_UNAVAILABLE","message":"Служба доставки временно недоступна, повторите попытку позже"}';
        }
    }
}
