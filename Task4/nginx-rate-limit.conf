events {}

http {
    # Канал клиента приходит в заголовке X-Client-Type, его выставляют веб- и мобильное приложение.
    # Неизвестный или пустой канал получает более строгий мобильный лимит, чтобы без заголовка нельзя было обойти ограничение
    map $http_x_client_type $client_channel {
        default mobile;
        web     web;
        mobile  mobile;
    }

    # Запрос учитывается только в зоне своего канала: для чужой зоны ключ пустой, а запросы с пустым ключом nginx не считает
    map $client_channel $web_limit_key {
        default "";
        web     $binary_remote_addr;
    }

    map $client_channel $mobile_limit_key {
        default "";
        mobile  $binary_remote_addr;
    }

    limit_req_zone $web_limit_key zone=web_per_ip:10m rate=50r/s;
    limit_req_zone $mobile_limit_key zone=mobile_per_ip:10m rate=30r/s;

    limit_req_status 429;
    limit_req_log_level warn;

    server {
        listen 80;

        # Веб и мобилки обращаются на этот ресурс, у каждого канала свой лимит на IP
        location /api/ {
            # burst — запас на одновременные запросы при открытии экрана (около 0,5 с лимита), nodelay — без искусственной задержки
            limit_req zone=web_per_ip burst=25 nodelay;
            limit_req zone=mobile_per_ip burst=15 nodelay;

            proxy_set_header X-Client-Channel $client_channel;
            proxy_pass http://backend;
        }
    }
}
